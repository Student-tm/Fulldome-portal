<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:Consolas,"Courier New",monospace;font-size:13px;background:#111;color:#fff;min-height:100vh;}
.hdr{background:#111;padding:10px 20px;display:flex;align-items:center;gap:14px;border-bottom:3px solid #CC0000;}
.pname{background:transparent;border:none;border-bottom:1px solid #333;color:#fff;font-family:Consolas,monospace;font-size:14px;font-weight:700;outline:none;padding:3px 0;flex:1;}
.pname::placeholder{color:#555;}
.hbtn{padding:5px 14px;border-radius:3px;border:1px solid #444;background:transparent;color:#aaa;cursor:pointer;font-family:Consolas,monospace;font-size:11px;font-weight:700;text-transform:uppercase;white-space:nowrap;}
.hbtn:hover{color:#fff;border-color:#666;}
.hbtn-red{background:#CC0000;border-color:#CC0000;color:#fff;}
.tg-btn{display:flex;align-items:center;gap:6px;background:#1a1a1a;border:1px solid #2a2a2a;border-radius:4px;padding:5px 12px;cursor:pointer;transition:border-color 0.15s;text-decoration:none;white-space:nowrap;}
.tg-btn:hover{border-color:#4a90d9;}
.tg-btn-icon{font-size:12px;color:#4a90d9;}
.tg-btn-label{font-size:11px;font-weight:700;color:#fff;text-transform:uppercase;letter-spacing:0.08em;}
.main{padding:16px 20px;max-width:1400px;margin:0 auto;}
.sbar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
.metric{background:#1a1a1a;border-radius:3px;padding:5px 14px;min-width:110px;border:1px solid #2a2a2a;border-left:3px solid #CC0000;}
.ml{font-size:8px;color:#666;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:2px;}
.mv{font-size:13px;font-weight:700;}
.grp{background:#1a1a1a;border-radius:3px;margin-bottom:12px;border:1px solid #2a2a2a;overflow:hidden;}
.ghdr{display:flex;align-items:center;gap:8px;padding:8px 12px;}
.gh-dome{background:#111;border-bottom:2px solid #CC0000;}
.gh-server{background:#1a1a2e;}
.gh-proj{background:#1a1a1a;border-left:4px solid #CC0000;}
.gh-speaker{background:#1a1a1a;border-left:4px solid #cc6600;}
.gh-cables{background:#1a1a1a;border-left:4px solid #6600cc;}
.gh-tools{background:#1a1a1a;border-left:4px solid #998800;}
.gh-custom{background:#2a2a2a;}
.gtitle{font-size:11px;font-weight:700;flex:1;letter-spacing:0.12em;text-transform:uppercase;color:#fff;}
.bsm{padding:3px 10px;font-size:11px;border-radius:3px;border:1px solid #444;background:transparent;color:#666;cursor:pointer;font-family:Consolas,monospace;font-weight:700;text-transform:uppercase;white-space:nowrap;}
.bsm:hover{border-color:#666;color:#ccc;}
.bsm-red{border-color:#CC0000;color:#CC0000;}
.bsm-red:hover{background:#CC0000;color:#fff;}
.bsm-light{border-color:#333;color:#666;background:#1a1a1a;}
.bsm-light:hover{background:#2a2a2a;}
.bsm-del{border-color:#f5c6c6;color:#c0392b;background:transparent;}
.bsm-del:hover{background:#2a0000;}
table{width:100%;border-collapse:collapse;table-layout:fixed;}
th{font-size:9px;font-weight:700;color:#666;text-align:left;padding:5px 8px;border-bottom:1px solid #222;background:#161616;text-transform:uppercase;letter-spacing:0.08em;white-space:nowrap;}
td{padding:3px 5px;border-bottom:1px solid #f5f5f5;vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:#fafafa;}
.ci{width:100%;border:none;background:transparent;color:#fff;font-size:12px;font-family:Consolas,monospace;outline:none;padding:3px 4px;border-radius:2px;}
.ci:focus{background:#f0f0f0;}
.ci::placeholder{color:#ddd;}
.tag{display:inline-block;background:#2a2a2a;border-radius:2px;padding:2px 7px;font-size:11px;color:#888;white-space:nowrap;}
.selwrap{position:relative;}
.dsel{width:100%;border:1px solid #333;background:#1a1a1a;color:#fff;font-size:11px;font-family:Consolas,monospace;outline:none;padding:3px 20px 3px 5px;border-radius:2px;cursor:pointer;appearance:none;-webkit-appearance:none;}
.selwrap::after{content:"v";position:absolute;right:5px;top:50%;transform:translateY(-50%);font-size:10px;color:#666;pointer-events:none;}
.addrow{display:flex;align-items:center;gap:6px;padding:6px 12px;font-size:11px;color:#999;cursor:pointer;border:none;background:transparent;width:100%;text-align:left;border-top:1px dashed #2a2a2a;font-family:Consolas,monospace;text-transform:uppercase;}
.addrow:hover{background:#fafafa;color:#555;}
.sdot{width:10px;height:10px;border-radius:50%;cursor:pointer;display:inline-block;transition:transform 0.15s;}
.sdot:hover{transform:scale(1.4);}
.menudrop{display:none;position:absolute;top:calc(100% + 4px);left:0;background:#1a1a1a;border:1px solid #2a2a2a;border-top:3px solid #CC0000;border-radius:3px;box-shadow:0 4px 20px rgba(0,0,0,0.5);z-index:50;min-width:170px;padding:4px 0;}
.menudrop.open{display:block;}
.mitem{display:flex;align-items:center;gap:10px;padding:8px 14px;cursor:pointer;font-family:Consolas,monospace;font-size:11px;font-weight:700;text-transform:uppercase;color:#ccc;}
.mitem:hover{background:#f5f5f5;}
.dot8{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.gni{flex:1;font-size:11px;font-weight:700;border:none;background:transparent;color:#fff;outline:none;font-family:Consolas,monospace;text-transform:uppercase;letter-spacing:0.1em;}
.overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.65);z-index:100;align-items:flex-start;justify-content:center;padding-top:40px;}
.overlay.open{display:flex;}
.mbox{background:#1a1a1a;border-radius:3px;border-top:3px solid #CC0000;padding:20px;width:520px;max-width:95vw;max-height:76vh;overflow-y:auto;box-shadow:0 8px 40px rgba(0,0,0,0.7);}
.mtitle{font-size:13px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;}
.msrch{width:100%;padding:7px 10px;border:1px solid #333;border-radius:2px;font-size:12px;font-family:Consolas,monospace;outline:none;margin-bottom:10px;background:#111;color:#fff;}
.msrch:focus{border-color:#CC0000;}
.dopt{padding:10px 12px;border-radius:2px;cursor:pointer;border:1px solid #2a2a2a;margin-bottom:5px;color:#ccc;}
.dopt:hover{border-color:#CC0000;background:#1f0000;}
.dopt-sz{font-size:13px;font-weight:700;}
.dopt-meta{font-size:10px;color:#666;margin-top:3px;display:flex;gap:6px;flex-wrap:wrap;}
.dtag{background:#2a2a2a;border-radius:2px;padding:1px 5px;}
.iopt{padding:8px 12px;border-radius:2px;cursor:pointer;border:1px solid #2a2a2a;margin-bottom:4px;color:#ccc;}
.iopt:hover{border-color:#CC0000;background:#1f0000;}
.clbl{font-size:9px;font-weight:700;color:#666;text-transform:uppercase;letter-spacing:0.1em;padding:8px 0 3px;border-top:1px solid #e8e8e8;margin-top:5px;}
.clbl:first-child{border-top:none;margin-top:0;}
@media print {
  .hdr { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .ghdr { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .overlay, #confirmModal { display: none !important; }
  .menudrop { display: none !important; }
  #addBtn, #exportBtn, #printBtn, #resetBtn, #selDomeBtn { display: none !important; }
  .bsm-del, .addrow, .bsm-light { display: none !important; }
  .sdot { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  body { background: #111; }
  .grp { break-inside: avoid; border: 1px solid #ccc; }
  .hdr { border-bottom: 3px solid #CC0000; }
}
</style>

<body>
<div class="hdr">
  <span id="backBtn" style="font-size:12px;color:#555;text-transform:uppercase;letter-spacing:0.1em;cursor:pointer;white-space:nowrap;padding-right:14px;border-right:1px solid #222;margin-right:4px">&#8592; Projects</span>
    <input class="pname" id="pname" placeholder="Project name..."/>
  <span id="lstatus" style="font-size:10px;color:#555;font-family:Consolas,monospace;text-transform:uppercase;white-space:nowrap;display:none">Loading...</span>
  <button class="hbtn hbtn-red" id="exportBtn">Export CSV</button>
  <button class="hbtn" id="printBtn" style="border-color:#444;color:#ccc">Print PDF</button>
  <a class="tg-btn" id="tg1Btn" style="display:none" target="_blank"><span class="tg-btn-icon">✈</span><span class="tg-btn-label">US Projects</span></a>
  <a class="tg-btn" id="tg2Btn" style="display:none" target="_blank"><span class="tg-btn-icon">✈</span><span class="tg-btn-label">Production</span></a>
  <img src="logo.png" style="height:43px;margin-left:auto" alt="Fulldome.pro"/>
</div>
<div class="main">
  <div class="sbar">
    <div class="metric"><div class="ml">Dome</div><div class="mv" id="sDome" style="font-size:13px">-</div></div>
    <div class="metric"><div class="ml">Items</div><div class="mv" id="sItems">0</div></div>
    <div class="metric" style="border-left-color:#1D9E75"><div class="ml" style="color:#1D9E75">Ready</div><div class="mv" id="sReady" style="color:#1D9E75">0</div></div>
    <div class="metric" style="border-left-color:#D85A30"><div class="ml" style="color:#D85A30">Needed</div><div class="mv" id="sNeeded" style="color:#D85A30">0</div></div>
  </div>
  <div class="grp">
    <div class="ghdr gh-dome">
      <span class="gtitle">Dome</span>
      <button class="bsm" style="border-color:#333;color:#888" id="resetBtn">Reset</button>
      <button class="bsm bsm-red" id="selDomeBtn">Select dome...</button>
    </div>
    <div id="domeContent"><div style="padding:20px;text-align:center;color:#aaa;font-size:11px;text-transform:uppercase">No dome selected</div></div>
  </div>
  <div style="position:relative;display:inline-block;margin-bottom:12px">
    <button class="hbtn" id="addBtn" style="color:#aaa;border-color:#333;background:transparent;font-size:11px">+ Add Group</button>
    <div class="menudrop" id="addMenu">
      <div class="mitem" id="mn-server"><div class="dot8" style="background:#4a90d9"></div>Server Rack</div>
      <div class="mitem" id="mn-proj"><div class="dot8" style="background:#CC0000"></div>Projectors</div>
      <div class="mitem" id="mn-speaker"><div class="dot8" style="background:#cc6600"></div>Speakers</div>
      <div class="mitem" id="mn-cables"><div class="dot8" style="background:#6600cc"></div>Cables</div>
      <div class="mitem" id="mn-tools"><div class="dot8" style="background:#998800"></div>Tools</div>
      <div style="border-top:1px solid #e8e8e8;margin:3px 0"></div>
      <div class="mitem" id="mn-custom" style="color:#888"><div class="dot8" style="background:#aaa"></div>Custom</div>
    </div>
  </div>
  <div id="grps"></div>
</div>
<div id="confirmModal" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.65);z-index:200;align-items:center;justify-content:center;">
  <div style="background:#fff;border-radius:3px;border-top:3px solid #CC0000;padding:24px;width:340px;box-shadow:0 8px 40px rgba(0,0,0,0.3);">
    <div style="font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:8px">Delete Group?</div>
    <div style="font-size:12px;color:#666;margin-bottom:20px">This action cannot be undone.</div>
    <div style="display:flex;gap:10px;justify-content:flex-end">
      <button id="confirmNo" style="padding:6px 16px;border-radius:3px;border:1px solid #ccc;background:#fff;color:#555;cursor:pointer;font-family:Consolas,monospace;font-size:11px;font-weight:700;text-transform:uppercase">Cancel</button>
      <button id="confirmYes" style="padding:6px 16px;border-radius:3px;border:1px solid #CC0000;background:#CC0000;color:#fff;cursor:pointer;font-family:Consolas,monospace;font-size:11px;font-weight:700;text-transform:uppercase">Delete</button>
    </div>
  </div>
</div>

<div class="overlay" id="domeModal">
  <div class="mbox">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
      <div class="mtitle">Select Dome</div>
      <button class="bsm bsm-light" id="closeDomeBtn">Close</button>
    </div>
    <input class="msrch" id="dSrch" placeholder="Search by size, type, serial#..."/>
    <div id="dList"></div>
  </div>
</div>
<div class="overlay" id="itemModal">
  <div class="mbox">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
      <div class="mtitle" id="iTitle">Select Item</div>
      <button class="bsm bsm-light" id="closeItemBtn">Close</button>
    </div>
    <input class="msrch" id="iSrch" placeholder="Search..."/>
    <div id="iList"></div>
  </div>
</div>
<script>
var DOMES=[];

var LENSES=[
  {domeType:'SRD', lens:'03S',    throwRatio:'0.48:1-0.57:1'},
  {domeType:'DX4', lens:'ELPL04', throwRatio:'0.64:1-0.77:1'},
  {domeType:'DX8', lens:'w06',    throwRatio:'1.19:1-1.62:1'},
  {domeType:'DX12',lens:'09/15',  throwRatio:'1.57:1-2.56:1'}
];

var GT={
  server:{label:'Server Rack',color:'#4a90d9',gh:'gh-server',
    cols:[{k:'item',l:'Server Name',w:'20%'},{k:'projSystem',l:'Proj. System',w:'10%'},{k:'resolution',l:'Resolution | PJT',w:'18%'},{k:'location',l:'Location',w:'12%'},{k:'gpu',l:'GPU',w:'14%'},{k:'comments',l:'Comments',w:'18%'}]},
  proj:{label:'Projectors',color:'#CC0000',gh:'gh-proj',
    cols:[{k:'item',l:'Model',w:'18%'},{k:'labelIp',l:'Label | IP',w:'18%'},{k:'qty',l:'Qty',w:'6%',t:'number'},{k:'sn',l:'S/N',w:'14%'},{k:'color',l:'Color',w:'8%'},{k:'hours',l:'Hours',w:'8%'},{k:'comments',l:'Comments',w:'10%'}]},
  speaker:{label:'Speakers',color:'#cc6600',gh:'gh-speaker',
    cols:[{k:'item',l:'Model',w:'20%'},{k:'qty',l:'QTY',w:'6%',t:'number'},{k:'power',l:'Power (W)',w:'14%'},{k:'current',l:'Current @120V',w:'14%'},{k:'spl',l:'Max SPL',w:'13%'},{k:'freq',l:'Frequency',w:'15%'},{k:'comments',l:'Comments',w:'10%'}]},
  cables:{label:'Cables',color:'#6600cc',gh:'gh-cables',
    cols:[{k:'item',l:'Cable',w:'30%'},{k:'qty',l:'Qty',w:'8%',t:'number'},{k:'price',l:'Price ($)',w:'10%'},{k:'comments',l:'Comments',w:'22%'},{k:'provided',l:'Provided',w:'13%'},{k:'link',l:'Link',w:'17%'}]},
  tools:{label:'Tools',color:'#998800',gh:'gh-tools',
    cols:[{k:'item',l:'Item',w:'32%'},{k:'qty',l:'Qty',w:'8%',t:'number'},{k:'comments',l:'Comments',w:'28%'},{k:'provided',l:'Provided',w:'15%'},{k:'link',l:'Link',w:'17%'}]},
  custom:{label:'Custom',color:'#888',gh:'gh-custom',
    cols:[{k:'item',l:'Item',w:'28%'},{k:'qty',l:'Qty',w:'7%',t:'number'},{k:'price',l:'Price ($)',w:'9%'},{k:'comments',l:'Comments',w:'20%'},{k:'provided',l:'Provided',w:'12%'},{k:'link',l:'Link',w:'16%'}]},
  lenses:{label:'Lenses (EPSON)',color:'#CC0000',gh:'gh-proj',
    cols:[{k:'item',l:'Type of Dome',w:'18%'},{k:'lens',l:'Lens',w:'14%'},{k:'throwRatio',l:'Throw Ratio',w:'18%'},{k:'qty',l:'QTY',w:'8%',t:'number'},{k:'comments',l:'Comments',w:'24%'},{k:'provided',l:'Provided',w:'10%'}]}
};
var selDome=null,domeSer='',domeUsed='';
var grps=[],gid=10,rid=100,pickerT=null;

var confirmCallback=null;
function showConfirm(cb){
  confirmCallback=cb;
  document.getElementById('confirmModal').style.display='flex';
}
document.getElementById('confirmNo').onclick=function(){
  document.getElementById('confirmModal').style.display='none';
  confirmCallback=null;
};
document.getElementById('confirmYes').onclick=function(){
  document.getElementById('confirmModal').style.display='none';
  if(confirmCallback)confirmCallback();
  confirmCallback=null;
};

document.getElementById('backBtn').onclick=function(){
  var p=new URLSearchParams(window.location.search);
  window.location.href='project_map_rental.html?project='+encodeURIComponent(p.get('project')||'')+'&name='+encodeURIComponent(p.get('name')||'');
};
document.getElementById('resetBtn').onclick=function(){selDome=null;domeSer='';domeUsed='';renderDome();updateSum();};
document.getElementById('selDomeBtn').onclick=function(){document.getElementById('dSrch').value='';renderDomeList();document.getElementById('domeModal').classList.add('open');};
document.getElementById('closeDomeBtn').onclick=function(){document.getElementById('domeModal').classList.remove('open');};
document.getElementById('closeItemBtn').onclick=function(){document.getElementById('itemModal').classList.remove('open');pickerT=null;};
document.getElementById('addBtn').onclick=function(e){e.stopPropagation();document.getElementById('addMenu').classList.toggle('open');};
document.getElementById('mn-server').onclick=function(){addGrp('server');};
document.getElementById('mn-proj').onclick=function(){addGrp('proj');};
document.getElementById('mn-speaker').onclick=function(){addGrp('speaker');};
document.getElementById('mn-cables').onclick=function(){addGrp('cables');};
document.getElementById('mn-tools').onclick=function(){addGrp('tools');};
document.getElementById('mn-custom').onclick=function(){addGrp('custom');};
document.getElementById('exportBtn').onclick=function(){exportCSV();};
document.getElementById('printBtn').onclick=function(){
  document.getElementById('addMenu').classList.remove('open');
  document.getElementById('domeModal').classList.remove('open');
  document.getElementById('itemModal').classList.remove('open');
  window.print();
};
document.addEventListener('click',function(){document.getElementById('addMenu').classList.remove('open');});
document.getElementById('domeModal').onclick=function(e){if(e.target===this)this.classList.remove('open');};
document.getElementById('itemModal').onclick=function(e){if(e.target===this){this.classList.remove('open');pickerT=null;}};
// Auto load on start
requireAuth(function(){
  autoLoad();
  loadProjectTG();
});

function loadProjectTG(){
  var params = new URLSearchParams(window.location.search);
  var pid = params.get('project') || '';
  if(!pid) return;
  getProjects().then(function(projects){
    var p = projects.find(function(x){ return x.id === pid; });
    if(!p) return;
    if(p.tg1){
      var b = document.getElementById('tg1Btn');
      b.href = p.tg1; b.style.display = 'flex';
    }
    if(p.tg2){
      var b = document.getElementById('tg2Btn');
      b.href = p.tg2; b.style.display = 'flex';
    }
  });
}
document.getElementById('dSrch').oninput=function(){renderDomeList();};
document.getElementById('iSrch').oninput=function(){renderItemList();};
document.getElementById('pname').oninput=function(){autoSave();};

function renderDomeList(){
  var q=document.getElementById('dSrch').value.toLowerCase();
  var f=DOMES.filter(function(d){return d.size.toLowerCase().includes(q)||d.type.toLowerCase().includes(q)||(d.serials||[]).some(function(s){return s.toLowerCase().includes(q);});});
  var el=document.getElementById('dList');el.innerHTML='';
  if(!f.length){el.innerHTML='<div style="color:#aaa;font-size:12px;padding:10px 0">Nothing found</div>';return;}
  f.forEach(function(d){
    var div=document.createElement('div');div.className='dopt';
    div.innerHTML='<div class="dopt-sz">'+d.size+'</div><div class="dopt-meta">'+(d.ductSize?'<span class="dtag">'+d.ductSize+'</span>':'')+(d.truss?'<span class="dtag">'+d.truss+'</span>':'')+'</div><div style="margin-top:3px;font-size:10px;color:#aaa;font-family:Consolas,monospace">'+(d.serials[0]?d.serials[0]+(d.serials.length>1?' +'+(d.serials.length-1)+' more':''):'No serial#')+'</div>';
    div.onclick=function(){selDome=d;domeSer=d.serials[0]||'';domeUsed='';document.getElementById('domeModal').classList.remove('open');renderDome();updateSum();autoSave();};
    el.appendChild(div);
  });
}

function renderDome(){
  var el=document.getElementById('domeContent');
  if(!selDome){el.innerHTML='<div style="padding:20px;text-align:center;color:#aaa;font-size:11px;text-transform:uppercase">No dome selected</div>';return;}
  var d=selDome;
  var serOpts=d.serials.map(function(s){return '<option value="'+s+'"'+(s===domeSer?' selected':'')+'>'+s+'</option>';}).join('');
  var drawingHtml=d.drawing?(d.drawing.startsWith('http')?'<a href="'+d.drawing+'" target="_blank" style="color:#185FA5;font-size:11px;font-family:Consolas,monospace;text-decoration:none">Link &#8599;</a>':'<span class="tag">'+d.drawing+'</span>'):'<span style="color:#ccc">-</span>';
  el.innerHTML='<table><colgroup><col style="width:10%"><col style="width:28%"><col style="width:22%"><col style="width:24%"><col style="width:16%"></colgroup><thead><tr><th>Size</th><th>Serial #</th><th>Duct Size</th><th>Truss</th><th>Drawing</th></tr></thead><tbody><tr><td><span style="display:inline-block;background:#111;color:#fff;border-radius:2px;padding:2px 8px;font-size:11px;font-weight:700">'+d.size+'</span></td><td><div class="selwrap"><select class="dsel" id="serSel">'+serOpts+'</select></div></td><td><span class="tag">'+(d.ductSize||'-')+'</span></td><td><span class="tag">'+(d.truss||'-')+'</span></td><td>'+drawingHtml+'</td></tr></tbody></table>';
  document.getElementById('serSel').onchange=function(){domeSer=this.value;};
}

function newRow(type){
  var def=GT[type];var r={id:rid++,status:0};
  def.cols.forEach(function(c){r[c.k]=c.k==='qty'?1:'';});
  return r;
}

function addGrp(type){

function renderItemList(){
  if(!pickerT)return;
  var q=document.getElementById('iSrch').value.toLowerCase();
  var cat=CATS[pickerT.type]||[];
  if(pickerT.type==='proj'){
    renderProjBrands(q);
    return;
  }
  if(pickerT.type==='lenses'){
    renderLensesPicker(q);
    return;
  }
  if(pickerT.type==='speaker'){
    renderSpeakerBrands(q);
    return;
  }
  var isObj=pickerT.type==='server';
  var f=cat.filter(function(n){
    if(isObj) return JSON.stringify(n).toLowerCase().includes(q);
    return n.toLowerCase().includes(q);
  });
  var el=document.getElementById('iList');el.innerHTML='';
  if(f.length){
    var lbl=document.createElement('div');lbl.className='clbl';lbl.textContent=GT[pickerT.type].label;el.appendChild(lbl);
    f.forEach(function(n){
      var d=document.createElement('div');d.className='iopt';
      if(pickerT.type==='server'){
        d.innerHTML='<div style="font-size:12px;font-weight:700;font-family:Consolas,monospace">'+n.name+'</div><div style="font-size:10px;color:#666;margin-top:3px;display:flex;gap:6px;flex-wrap:wrap"><span class="dtag">'+n.projSystem+'</span><span class="dtag">'+n.resolution+'</span><span class="dtag">'+n.location+'</span><span class="dtag">'+n.gpu+'</span></div>';
        d.onclick=(function(srv){return function(){
          var g=grps.find(function(x){return x.id===pickerT.gid;});
          var r=g&&g.rows.find(function(x){return x.id===pickerT.rid;});
          if(r){r.item=srv.name;r.projSystem=srv.projSystem;r.resolution=srv.resolution;r.location=srv.location;r.gpu=srv.gpu;}
          document.getElementById('itemModal').classList.remove('open');pickerT=null;renderGrps();
        };})(n);
      }
      el.appendChild(d);
    });
  } else {el.innerHTML='<div style="color:#aaa;font-size:12px;padding:8px 0">Nothing found</div>';}
  appendManualInput(el);
}

function updateSum(){
  document.getElementById('sDome').textContent=selDome?selDome.size:'-';
  var items=0,ready=0,needed=0;
  grps.forEach(function(g){g.rows.forEach(function(r){if(r.item){items++;if(r.status===1)ready++;if(r.status===2)needed++;}});});
  document.getElementById('sItems').textContent=items;
  document.getElementById('sReady').textContent=ready;
  document.getElementById('sNeeded').textContent=needed;
  autoSave();
}

function autoSave(){
  var projectId = new URLSearchParams(window.location.search).get('project') || 'default';
  var projectName = decodeURIComponent(new URLSearchParams(window.location.search).get('name') || '');
  var data = {
    projectName: document.getElementById('pname').value,
    dome: selDome,
    domeSer: domeSer,
    groups: grps,
    savedAt: Date.now()
  };
  saveEquipment(projectId, data, projectName).then(function(){
    showSavedIndicator();
  }).catch(function(e){
    console.error('Save error',e);
  });
}

function showSavedIndicator(){
  var el=document.getElementById('lstatus');
  el.textContent='Saved';
  el.style.display='block';
  el.style.color='#1D9E75';
  setTimeout(function(){el.style.display='none';el.style.color='#555';},2000);
}

function autoLoad(){
  var params = new URLSearchParams(window.location.search);
  var projectId = params.get('project') || 'default';
  var projectName = params.get('name') || '';
  if(projectName) document.getElementById('pname').value = decodeURIComponent(projectName);

  document.getElementById('lstatus').textContent='Loading...';
  document.getElementById('lstatus').style.display='block';

  getDomes().then(function(domes){
    DOMES = domes;
    renderDome();
    return loadEquipment(projectId, projectName);
  }).then(function(saved){
    document.getElementById('lstatus').style.display='none';
    if(saved){
      if(saved.projectName) document.getElementById('pname').value = saved.projectName;
      if(saved.dome){ selDome=saved.dome; domeSer=saved.domeSer||''; renderDome(); }
      if(saved.groups && saved.groups.length){ grps=saved.groups; gid=Math.max.apply(null,grps.map(function(g){return g.id;}))+1; rid=200; renderGrps(); }
      updateSum();
    }
  }).catch(function(e){
    document.getElementById('lstatus').textContent='Error: '+e.message;
    console.error('Load error',e);
  });
}

    var def=GT[g.type];
    csv+='\n'+g.label+'\n'+def.cols.map(function(c){return c.l;}).join(',')+',Status\n';
    g.rows.forEach(function(r){csv+=def.cols.map(function(c){return '"'+(r[c.k]||'')+'"';}).join(',')+','+sl[r.status]+'\n';});
  });
  var blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8;'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=p.replace(/\s+/g,'_')+'.csv';a.click();
}
</script>
