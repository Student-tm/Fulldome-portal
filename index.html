<!DOCTYPE html>
<html lang="en">
<head>
<script>
/* AUTO CACHE BUSTER */
(function(){
  var V="20260411184008";
  if(localStorage.getItem("_fv")!==V){localStorage.setItem("_fv",V);if(performance.navigation.type!==1)location.reload(true);}
})();

<meta charset="UTF-8"/>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Fulldome.pro — Internal Portal</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:Consolas,"Courier New",monospace;background:#0d0d0d;color:#fff;min-height:100vh;display:flex;flex-direction:column;}
header{padding:16px 40px;border-bottom:3px solid #CC0000;display:flex;align-items:center;justify-content:space-between;background:#111;flex-shrink:0;}
.tagline{font-size:11px;color:#555;text-transform:uppercase;letter-spacing:0.15em;}

/* Three rows */
.rows{flex:1;display:flex;flex-direction:column;}
.row{display:flex;align-items:stretch;border-bottom:1px solid #1a1a1a;flex:1;min-height:0;}
.row:last-child{border-bottom:none;}

/* Module button side */
.mod{width:280px;flex-shrink:0;border-right:1px solid #1a1a1a;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;padding:24px 32px;cursor:pointer;transition:background 0.2s;background:#111;}
.mod:hover{background:#1a1a1a;}
.mod:hover .mod-arrow{color:#CC0000;}
.mod-label{font-size:9px;font-weight:700;color:#CC0000;text-transform:uppercase;letter-spacing:0.2em;margin-bottom:6px;}
.mod-title{font-size:28px;font-weight:700;color:#fff;margin-bottom:4px;}
.mod-desc{font-size:11px;color:#444;line-height:1.5;}
.mod-arrow{font-size:18px;color:#2a2a2a;margin-top:12px;transition:color 0.2s;}

/* Projects side */
.proj-side{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.proj-head{display:flex;align-items:center;gap:10px;padding:8px 20px;border-bottom:1px solid #1a1a1a;background:#0d0d0d;flex-shrink:0;}
.proj-head-title{font-size:9px;font-weight:700;color:#444;text-transform:uppercase;letter-spacing:0.15em;flex:1;}
.proj-head-count{font-size:9px;color:#333;}
.proj-refresh{background:none;border:none;color:#333;cursor:pointer;font-size:12px;font-family:Consolas,monospace;padding:2px 4px;}
.proj-refresh:hover{color:#CC0000;}
.proj-scroll{overflow-y:auto;flex:1;display:flex;flex-direction:column;}
.proj-scroll::-webkit-scrollbar{width:3px;}
.proj-scroll::-webkit-scrollbar-thumb{background:#2a2a2a;border-radius:2px;}
.proj-scroll::-webkit-scrollbar-thumb:hover{background:#CC0000;}

/* Project row */
.prow{display:flex;align-items:center;gap:12px;padding:8px 20px;border-bottom:1px solid #111;cursor:pointer;transition:all 0.1s;flex-shrink:0;}
.prow:hover{background:#1a1a1a;padding-left:24px;}
.prow:hover .prow-arrow{color:#CC0000;}
.prow.is-done{opacity:0.4;}
.prow-name{font-size:13px;font-weight:700;color:#fff;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.prow-tags{display:flex;gap:5px;flex-shrink:0;}
.ptag{font-size:9px;font-weight:700;padding:1px 6px;border-radius:2px;}
.ptag-loc,.ptag-dl{background:#f0a500;color:#111;}
.ptag-ship{color:#f0a500;border:1px solid #f0a500;}
.prow-status{font-size:9px;font-weight:700;padding:1px 6px;border-radius:2px;flex-shrink:0;}
.st-active{color:#1D9E75;border:1px solid #1D9E75;}
.st-done{color:#333;border:1px solid #2a2a2a;}
.prow-arrow{font-size:11px;color:#2a2a2a;flex-shrink:0;}
.psection{font-size:8px;font-weight:700;color:#333;text-transform:uppercase;letter-spacing:0.15em;padding:5px 20px;background:#0d0d0d;border-bottom:1px solid #111;flex-shrink:0;}
.pempty{padding:16px 20px;font-size:11px;color:#2a2a2a;font-style:italic;}

footer{padding:10px 40px;border-top:1px solid #1a1a1a;display:flex;align-items:center;justify-content:space-between;background:#111;flex-shrink:0;}
.ft{font-size:9px;color:#333;text-transform:uppercase;letter-spacing:0.1em;}
</style>
</head>
<body>
<header>
  <img src="logo.png" style="height:36px" alt="Fulldome.pro"/>
  <span class="tagline">Internal Staff Portal</span>
</header>

<div class="rows">
  <!-- ROW 1: RENTAL -->
  <div class="row">
    <div class="mod" onclick="window.location.href='rental.html'">
      <div class="mod-label">Module 01</div>
      <div class="mod-title">Rental</div>
      <div class="mod-desc">Dome rental projects</div>
      <div class="mod-arrow">→</div>
    </div>
    <div class="proj-side">
      <div class="proj-head">
        <span class="proj-head-title">Rental Projects</span>
        <span class="proj-head-count" id="rentalCount"></span>
        <button class="proj-refresh" onclick="loadRental()" title="Refresh">↻</button>
      </div>
      <div class="proj-scroll" id="rentalList"><div class="pempty">Loading...</div></div>
    </div>
  </div>

  <!-- ROW 2: SALES -->
  <div class="row">
    <div class="mod" onclick="window.location.href='sales.html'">
      <div class="mod-label">Module 02</div>
      <div class="mod-title">Sales</div>
      <div class="mod-desc">Dome sales projects</div>
      <div class="mod-arrow">→</div>
    </div>
    <div class="proj-side">
      <div class="proj-head">
        <span class="proj-head-title">Sales Projects</span>
        <span class="proj-head-count" id="salesCount"></span>
        <button class="proj-refresh" onclick="loadSales()" title="Refresh">↻</button>
      </div>
      <div class="proj-scroll" id="salesList"><div class="pempty">Loading...</div></div>
    </div>
  </div>

  <!-- ROW 3: INVENTORY -->
  <div class="row">
    <div class="mod" onclick="window.open('https://docs.google.com/spreadsheets/d/1FZ5Y4ukKpUs0LmrC8e02am2pN3rc9QuG6ePNKb51mfw/edit','_blank')">
      <div class="mod-label">Module 03</div>
      <div class="mod-title">Inventory</div>
      <div class="mod-desc">Equipment database</div>
      <div class="mod-arrow">↗</div>
    </div>
    <div class="proj-side" style="align-items:center;justify-content:center;">
      <div class="pempty">Google Sheets inventory database</div>
    </div>
  </div>
</div>

<footer>
  <span class="ft">Fulldome.pro © 2026 — Internal use only</span>
  <a href="https://t.me/c/3563769716/4" target="_blank" style="font-size:9px;color:#CC0000;text-decoration:none;border:1px solid #CC0000;padding:3px 10px;border-radius:2px;text-transform:uppercase;letter-spacing:0.1em">Telegram ↗</a>
</footer>

<script src="auth.js?v=20260411183931"></script>
<script>
var SHEET_ID = '1FZ5Y4ukKpUs0LmrC8e02am2pN3rc9QuG6ePNKb51mfw';

initGoogleAuth(function(){
  loadRental();
  loadSales();
});

function fmtD(d){
  if(!d) return '';
  var p=d.split('-'); return p.length===3 ? p[1]+'/'+p[2]+'/'+p[0] : d;
}

async function fetchSheet(range){
  var tok = localStorage.getItem('gtoken');
  var r = await fetch('https://sheets.googleapis.com/v4/spreadsheets/'+SHEET_ID+'/values/'+encodeURIComponent(range)+'?_='+Date.now(), {headers:{Authorization:'Bearer '+tok}});
  var d = await r.json();
  return d.values || [];
}

async function loadRental(){
  renderList('rentalList', 'rentalCount', null, 'rental');
  try {
    var rows = (await fetchSheet('RentalProjects!A:I')).slice(1).filter(function(r){return r[0]&&r[1];});
    var ship = await fetchSheet('Shipping!A:B');
    var projects = rows.map(function(r){
      var s = ship.find(function(x){return x[0]===String(r[0]);});
      return {id:r[0],name:r[1],address:r[2]||'',start:r[3]||'',status:r[7]||'active',ship:s&&s[1]?s[1]:''};
    });
    renderList('rentalList','rentalCount',projects,'rental');
  } catch(e){ document.getElementById('rentalList').innerHTML='<div class="pempty">Error loading</div>'; }
}

async function loadSales(){
  renderList('salesList','salesCount',null,'sales');
  try {
    var rows = (await fetchSheet('SalesProjects!A:I')).slice(1).filter(function(r){return r[0]&&r[1];});
    var projects = rows.map(function(r){
      return {id:r[0],name:r[1],address:r[2]||'',start:r[3]||'',status:r[7]||'active',ship:''};
    });
    renderList('salesList','salesCount',projects,'sales');
  } catch(e){ document.getElementById('salesList').innerHTML='<div class="pempty">Error loading</div>'; }
}

function renderList(listId, countId, projects, type){
  var el = document.getElementById(listId);
  var cnt = document.getElementById(countId);
  if(!projects){ el.innerHTML='<div class="pempty">Loading...</div>'; return; }
  var active = projects.filter(function(p){return p.status!=='done';});
  var done = projects.filter(function(p){return p.status==='done';});
  cnt.textContent = active.length+' active';
  var html = '';
  if(!projects.length){ el.innerHTML='<div class="pempty">No projects yet</div>'; return; }
  if(active.length){
    html += active.map(function(p){ return makeRow(p,type); }).join('');
  }
  if(done.length){
    html += '<div class="psection">Completed ('+done.length+')</div>';
    html += done.map(function(p){ return makeRow(p,type); }).join('');
  }
  el.innerHTML = html;
  el.querySelectorAll('.prow').forEach(function(r){
    r.addEventListener('click', function(){
      window.location.href='project_map_rental.html?project='+encodeURIComponent(r.dataset.id)+'&name='+r.dataset.name+'&type='+type;
    });
  });
}

function makeRow(p, type){
  var tags='';
  if(p.address) tags+='<span class="ptag ptag-loc">'+p.address+'</span>';
  var isDone=p.status==='done';
  return '<div class="prow'+(isDone?' is-done':'')+'" data-id="'+p.id+'" data-name="'+encodeURIComponent(p.name)+'">'
    +'<div class="prow-name">'+p.name+'</div>'
    +(tags?'<div class="prow-tags">'+tags+'</div>':'')
    +'<div class="prow-status '+(isDone?'st-done':'st-active')+'">'+(isDone?'Done':'Active')+'</div>'
    +'<div class="prow-arrow">→</div>'
    +'</div>';
}
</script>
</body>
</html>
