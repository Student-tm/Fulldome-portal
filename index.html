<meta charset="UTF-8"/>

<title>Fulldome.pro — Internal Portal</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:Consolas,"Courier New",monospace;background:#17171a;color:#eaeaea;min-height:100vh;display:flex;flex-direction:column;}
header{padding:16px 40px;border-bottom:3px solid #CC0000;display:flex;align-items:center;justify-content:space-between;background:#1f2128;flex-shrink:0;}
.tagline{font-size:11px;color:#888c98;text-transform:uppercase;letter-spacing:0.15em;}

/* Three rows */
.rows{flex:1;display:flex;flex-direction:column;}
.row{display:flex;align-items:stretch;border-bottom:1px solid #2e3039;flex:1;min-height:0;}
.row:last-child{border-bottom:none;}

/* Module button side */
.mod{width:280px;flex-shrink:0;border-right:1px solid #2e3039;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 32px;cursor:pointer;transition:background 0.2s;background:#1f2128;text-align:center;}
.mod:hover{background:#2a2d35;}
.mod:hover .mod-arrow{color:#CC0000;}
.mod-label{font-size:10px;font-weight:700;color:#CC0000;text-transform:uppercase;letter-spacing:0.2em;margin-bottom:6px;}
.mod-title{font-size:30px;font-weight:700;color:#eaeaea;margin-bottom:4px;}
.mod-desc{font-size:12px;color:#888c98;line-height:1.5;}
.mod-arrow{font-size:18px;color:#4a4f5c;margin-top:auto;transition:color 0.2s;}
.mod-badge{display:inline-flex;align-items:center;gap:6px;font-size:10px;font-weight:700;color:#1D9E75;border:1px solid #1D9E75;border-radius:2px;padding:1px 8px;margin-top:8px;width:fit-content;}
.mod-ship{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:700;color:#f0a500;margin-top:4px;}

/* Projects side */
.proj-side{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.proj-panes{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.pane-header{font-size:9px;font-weight:700;color:#4a4f5c;text-transform:uppercase;letter-spacing:0.15em;padding:0 20px;height:24px;background:transparent;border-top:1px solid #2a2d35;flex-shrink:0;display:flex;align-items:center;gap:10px;}
.pane-header::after{content:'';flex:1;height:1px;background:#2a2d35;}
.pane-divider{height:1px;background:#2e3039;flex-shrink:0;}
.proj-scroll{flex:1;overflow-y:auto;display:flex;flex-direction:column;min-height:0;}
.qa-col{width:280px;flex-shrink:0;border-left:1px solid #2e3039;display:flex;flex-direction:column;background:#1f2128;overflow:hidden;}
.qa-panes{flex:1;display:flex;flex-direction:column;overflow:hidden;min-height:0;}
.qa-rows{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.qa-row{display:flex;align-items:center;gap:6px;padding:0 12px;border-bottom:1px solid #2a2d35;flex-shrink:0;height:38px;}
.qa-row.active-row{background:#2a2d35;}
.qb{display:flex;align-items:center;justify-content:center;padding:2px 0;border:1px solid #2e3039;border-radius:2px;background:transparent;color:#6b7080;font-family:Consolas,monospace;font-size:10px;font-weight:700;cursor:pointer;text-decoration:none;white-space:nowrap;transition:all 0.12s;width:52px;}
.qb:hover{border-color:#CC0000;color:#fff;}
.qb-tg:hover{border-color:#4a90d9;color:#4a90d9;}
.qa-head{display:flex;align-items:center;padding:8px 20px;border-bottom:1px solid #2e3039;background:#1f2128;font-size:10px;font-weight:700;color:#888c98;text-transform:uppercase;letter-spacing:0.15em;flex-shrink:0;height:37px;}
.proj-head{display:flex;align-items:center;gap:10px;padding:8px 20px;border-bottom:1px solid #2e3039;background:#1f2128;flex-shrink:0;height:37px;}
.proj-head-title{font-size:10px;font-weight:700;color:#888c98;text-transform:uppercase;letter-spacing:0.15em;flex:1;}
.proj-head-count{font-size:10px;color:#6b7080;}
.proj-refresh{background:none;border:none;color:#6b7080;cursor:pointer;font-size:12px;font-family:Consolas,monospace;padding:2px 4px;}
.proj-refresh:hover{color:#CC0000;}
.proj-scroll{overflow-y:auto;flex:1;display:flex;flex-direction:column;}
.proj-scroll::-webkit-scrollbar{width:3px;}
.proj-scroll::-webkit-scrollbar-thumb{background:#4a4f5c;border-radius:2px;}
.proj-scroll::-webkit-scrollbar-thumb:hover{background:#CC0000;}

/* Project row */
.prow{display:flex;align-items:center;gap:12px;padding:0 20px;border-bottom:1px solid #2a2d35;cursor:pointer;transition:all 0.1s;flex-shrink:0;height:38px;}
.prow:hover{background:#2a2d35;padding-left:24px;}
.prow:hover .prow-arrow{color:#CC0000;}
.prow.is-done{opacity:0.4;}
.prow-name{font-size:14px;font-weight:700;color:#eaeaea;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.prow-tags{display:flex;gap:5px;flex-shrink:0;}
.ptag{font-size:9px;font-weight:700;padding:1px 6px;border-radius:2px;}
.ptag-loc,.ptag-dl{background:#f0a500;color:#17171a;}
.ptag-ship{color:#f0a500;border:1px solid #f0a500;}
.prow-status{font-size:9px;font-weight:700;padding:1px 6px;border-radius:2px;flex-shrink:0;}
.st-active{color:#1D9E75;border:1px solid #1D9E75;}
.st-done{color:#4a4f5c;border:1px solid #4a4f5c;}
.prow-arrow{font-size:11px;color:#4a4f5c;flex-shrink:0;}
.psection{font-size:9px;font-weight:700;color:#888c98;text-transform:uppercase;letter-spacing:0.15em;padding:0 20px;height:28px;background:#1f2128;border-bottom:1px solid #2a2d35;flex-shrink:0;display:flex;align-items:center;cursor:pointer;user-select:none;}
.psection:hover{color:#eaeaea;}
.psection-arrow{margin-left:auto;font-size:10px;transition:transform 0.2s;color:#4a4f5c;}
.psection.collapsed .psection-arrow{transform:rotate(-90deg);}
.pgroup{display:flex;flex-direction:column;}
.qa-sep{height:28px;border-bottom:1px solid #2a2d35;background:#1f2128;flex-shrink:0;}
.pgroup.collapsed .prow{display:none;}
.qa-group{display:flex;flex-direction:column;}
.qa-group.collapsed .qa-row{display:none;}
.pempty{padding:16px 20px;font-size:12px;color:#4a4f5c;font-style:italic;}

footer{padding:10px 40px;border-top:1px solid #2e3039;display:flex;align-items:center;justify-content:space-between;background:#1f2128;flex-shrink:0;}
.ft{font-size:9px;color:#6b7080;text-transform:uppercase;letter-spacing:0.1em;}
</style>
</head>
<body>
<header>
  <img src="logo.png" style="height:36px" alt="Fulldome.pro"/>

<div class="rows">

  <div class="row">
    <div class="mod" onclick="window.location.href='rental.html'">
      <div class="mod-label">Module 01</div>
      <div class="mod-title">Rental</div>
      <div class="mod-badge" id="rentalBadge" style="display:none"></div>
      <div class="mod-ship" id="rentalShip" style="display:none"></div>
      <div class="mod-arrow">→</div>
    </div>
    <div class="proj-side">
      <div class="proj-head">
        <span class="proj-head-title">Rental Projects</span>
        <span class="proj-head-count" id="rentalCount"></span>
        <button class="proj-refresh" onclick="loadRental()" title="Refresh">↻</button>
      </div>
      <div class="proj-panes" id="rentalList">

        <div class="pane-done proj-scroll"></div>

    </div>
    <div class="qa-col" id="rentalQA">

      <div class="qa-panes">

        <div class="qa-pane-active" style="flex:1;overflow-y:auto;display:flex;flex-direction:column;min-height:0;"></div>
        <div class="pane-header"></div>
        <div class="qa-pane-done" style="flex:1;overflow-y:auto;display:flex;flex-direction:column;min-height:0;"></div>
      </div>
    </div>
  </div>

  <!-- ROW 2: SALES -->
  <div class="row">
    <div class="mod" onclick="window.location.href='sales.html'">
      <div class="mod-label">Module 02</div>
      <div class="mod-title">Sales</div>
      <div class="mod-badge" id="salesBadge" style="display:none"></div>
      <div class="mod-ship" id="salesShip" style="display:none"></div>
      <div class="mod-arrow">→</div>
    </div>
    <div class="proj-side">
      <div class="proj-head">
        <span class="proj-head-title">Sales Projects</span>
        <span class="proj-head-count" id="salesCount"></span>
        <button class="proj-refresh" onclick="loadSales()" title="Refresh">↻</button>
      </div>
      <div class="proj-panes" id="salesList">
        <div class="pane-header">Current</div>
        <div class="pane-active proj-scroll"></div>
        <div class="pane-divider"></div>
        <div class="pane-header">Completed</div>
        <div class="pane-done proj-scroll"></div>
      </div>
    </div>
    <div class="qa-col" id="salesQA">
      <div class="qa-head">Quick Actions</div>
      <div class="qa-panes">
        <div class="pane-header" style="border-top:none;"></div>
        <div class="qa-pane-active" style="flex:1;overflow-y:auto;display:flex;flex-direction:column;min-height:0;"></div>
        <div class="pane-header"></div>
        <div class="qa-pane-done" style="flex:1;overflow-y:auto;display:flex;flex-direction:column;min-height:0;"></div>

  </div>

  <!-- ROW 3: INVENTORY -->
  <div class="row">

<script src="auth.js?v=20260411183931"></script>
<script>
var SHEET_ID = '1FZ5Y4ukKpUs0LmrC8e02am2pN3rc9QuG6ePNKb51mfw';

initGoogleAuth(function(){
  loadRental();
  loadSales();
});

function fmtD(d){
  if(!d) return '';
  var p=d.split('-'); return p.length===3 ? p[1]+'/'+p[2]+'/'+p[0] : d;
}

async function fetchSheet(range){
  var tok = localStorage.getItem('gtoken');
  var r = await fetch('https://sheets.googleapis.com/v4/spreadsheets/'+SHEET_ID+'/values/'+encodeURIComponent(range)+'?_='+Date.now(), {headers:{Authorization:'Bearer '+tok}});
  var d = await r.json();
  return d.values || [];
}

async function loadRental(){
  renderList('rentalList', 'rentalCount', null, 'rental');
  try {
    var rows = (await fetchSheet('RentalProjects!A:I')).slice(1).filter(function(r){return r[0]&&r[1];});
    var ship = await fetchSheet('Shipping!A:B');
    var projects = rows.map(function(r){
      var s = ship.find(function(x){return x[0]===String(r[0]);});
      return {id:r[0],name:r[1],address:r[2]||'',start:r[3]||'',status:r[7]||'active',ship:s&&s[1]?s[1]:'',tg1:r[4]||'',tg2:r[5]||''};
    });
    renderList('rentalList','rentalCount',projects,'rental');
    // Badge
    var activeCount = projects.filter(function(p){return p.status!=='done';}).length;
    var badge = document.getElementById('rentalBadge');
    badge.textContent = activeCount + ' active';
    badge.style.display = 'inline-flex';
    // Nearest shipping
    var ships = projects.filter(function(p){return p.ship && p.status!=='done';})
      .map(function(p){return p.ship;}).sort();
    if(ships.length){
      var d=ships[0].split('-'); var sh=document.getElementById('rentalShip');
      sh.textContent = '✈ '+d[1]+'/'+d[2]; sh.style.display='inline-flex';
    }
  } catch(e){ document.getElementById('rentalList').innerHTML='<div class="pempty">Error loading</div>'; }
}

async function loadSales(){
  renderList('salesList','salesCount',null,'sales');
  try {
    var rows = (await fetchSheet('SalesProjects!A:I')).slice(1).filter(function(r){return r[0]&&r[1];});
    var projects = rows.map(function(r){
      return {id:r[0],name:r[1],address:r[2]||'',start:r[3]||'',status:r[7]||'active',ship:'',tg1:r[4]||'',tg2:r[5]||''};
    });
    renderList('salesList','salesCount',projects,'sales');
    var activeCount = projects.filter(function(p){return p.status!=='done';}).length;
    var badge = document.getElementById('salesBadge');
    badge.textContent = activeCount + ' active';
    badge.style.display = 'inline-flex';
  } catch(e){ document.getElementById('salesList').innerHTML='<div class="pempty">Error loading</div>'; }
}

function renderList(listId, countId, projects, type){
  var el = document.getElementById(listId);
  var cnt = document.getElementById(countId);
  if(!projects){ 
    el.querySelector('.pane-active').innerHTML='<div class="pempty">Loading...</div>';
    return; 
  }
  var active = projects.filter(function(p){return p.status!=='done';}).sort(function(a,b){
    if(!a.ship && !b.ship) return 0;
    if(!a.ship) return 1;
    if(!b.ship) return -1;
    return a.ship < b.ship ? -1 : 1;
  });
  var done = projects.filter(function(p){return p.status==='done';});
  cnt.textContent = active.length+' active · '+done.length+' done';

  var paneA = el.querySelector('.pane-active');
  var paneD = el.querySelector('.pane-done');

  paneA.innerHTML = active.length
    ? active.map(function(p){return makeRow(p,type);}).join('')
    : '<div class="pempty">No active projects</div>';

  paneD.innerHTML = done.length
    ? done.map(function(p){return makeRow(p,type);}).join('')
    : '<div class="pempty">No completed projects</div>';

  el.querySelectorAll('.prow').forEach(function(r){
    r.addEventListener('click', function(){
      window.location.href='project_map_rental.html?project='+encodeURIComponent(r.dataset.id)+'&name='+r.dataset.name+'&type='+type;
    });
  });
  var qaId = type==='rental' ? 'rentalQA' : 'salesQA';
  buildQARows(el, qaId, type);
}

function buildQARows(listEl, qaId, type){
  var qaEl = document.getElementById(qaId);
  if(!qaEl) return;
  var paneA = listEl.querySelector('.pane-active');
  var paneD = listEl.querySelector('.pane-done');
  var qaPaneA = qaEl.querySelector('.qa-pane-active');
  var qaPaneD = qaEl.querySelector('.qa-pane-done');
  if(!qaPaneA || !qaPaneD) return;

  qaPaneA.innerHTML = '';
  qaPaneD.innerHTML = '';

  if(paneA) Array.from(paneA.children).forEach(function(child){
    if(!child.classList.contains('prow')) return;
    qaPaneA.appendChild(makeQARow(child, type));
  });
  if(paneD) Array.from(paneD.children).forEach(function(child){
    if(!child.classList.contains('prow')) return;
    qaPaneD.appendChild(makeQARow(child, type));
  });

  if(paneA) paneA.addEventListener('scroll', function(){ qaPaneA.scrollTop = paneA.scrollTop; });
  if(paneD) paneD.addEventListener('scroll', function(){ qaPaneD.scrollTop = paneD.scrollTop; });
}

function makeQARow(row, type){
  var div = document.createElement('div');
  div.className = 'qa-row';
  var pid = encodeURIComponent(row.dataset.id);
  var pname = row.dataset.name;
  var tg1 = row.dataset.tg1;
  var tg2 = row.dataset.tg2;
  if(tg1 && tg1!='undefined' && tg1!='')
    div.innerHTML += '<a class="qb qb-tg" href="'+tg1+'" target="_blank" onclick="event.stopPropagation()">✈ US</a>';
  if(tg2 && tg2!='undefined' && tg2!='')
    div.innerHTML += '<a class="qb qb-tg" href="'+tg2+'" target="_blank" onclick="event.stopPropagation()">✈ Prod</a>';
  div.innerHTML += '<a class="qb" href="equipment.html?project='+pid+'&name='+pname+'" onclick="event.stopPropagation()">EQ</a>';
  div.innerHTML += '<a class="qb" href="server_configurator.html?project='+pid+'&name='+pname+'" onclick="event.stopPropagation()">SRV</a>';
  div.innerHTML += '<a class="qb" href="https://drive.google.com/drive/search?q='+decodeURIComponent(pname)+'" target="_blank" onclick="event.stopPropagation()">📁</a>';
  row.addEventListener('mouseenter', function(){ div.classList.add('active-row'); });
  row.addEventListener('mouseleave', function(){ div.classList.remove('active-row'); });
  return div;
}

function makeRow(p, type){
  var tags='';
  if(p.address) tags+='<span class="ptag ptag-loc">'+p.address+'</span>';
  var isDone=p.status==='done';
  return '<div class="prow'+(isDone?' is-done':'')+'" data-id="'+p.id+'" data-name="'+encodeURIComponent(p.name)+'" data-tg1="'+(p.tg1||'')+'" data-tg2="'+(p.tg2||'')+'">'
    +'<div class="prow-name">'+p.name+'</div>'
    +(tags?'<div class="prow-tags">'+tags+'</div>':'')
    +'<div class="prow-status '+(isDone?'st-done':'st-active')+'">'+(isDone?'Done':'Active')+'</div>'
    +'<div class="prow-arrow">→</div>'
    +'</div>';
}
</script>
</body>
</html>
