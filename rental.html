<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Fulldome.pro — Rental Projects</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:Consolas,"Courier New",monospace;background:#111;color:#fff;min-height:100vh;display:flex;flex-direction:column;}
header{padding:16px 32px;border-bottom:3px solid #CC0000;display:flex;align-items:center;gap:20px;}
.back{font-size:11px;color:#555;text-transform:uppercase;letter-spacing:0.1em;cursor:pointer;display:flex;align-items:center;gap:6px;}
.back:hover{color:#CC0000;}
.header-title{font-size:12px;font-weight:700;color:#fff;text-transform:uppercase;letter-spacing:0.15em;flex:1;}
.main{flex:1;padding:32px;}
.section-label{font-size:9px;font-weight:700;color:#CC0000;text-transform:uppercase;letter-spacing:0.2em;margin-bottom:16px;}
.new-btn{display:flex;align-items:center;gap:12px;background:#1a1a1a;border:1px dashed #CC0000;border-radius:3px;padding:18px 24px;cursor:pointer;width:100%;max-width:400px;transition:all 0.2s;margin-bottom:40px;}
.new-btn:hover{background:#CC0000;}
.new-btn:hover .ni{color:#fff;}
.new-btn:hover .nt{color:#fff;}
.new-btn:hover .ns{color:rgba(255,255,255,0.7);}
.ni{font-size:20px;color:#CC0000;font-weight:700;transition:color 0.2s;}
.nt{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:#fff;}
.ns{font-size:10px;color:#555;margin-top:2px;}
.projects-list{display:flex;flex-direction:column;gap:8px;max-width:900px;}
.pitem{background:#1a1a1a;border:1px solid #2a2a2a;border-left:3px solid #CC0000;border-radius:3px;padding:14px 20px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:all 0.15s;}
.pitem:hover{background:#222;border-color:#CC0000;}
.pname{font-size:13px;font-weight:700;flex:1;}
.pclient{font-size:10px;color:#555;background:#111;border-radius:2px;padding:2px 8px;white-space:nowrap;}
.pdate{font-size:10px;color:#444;white-space:nowrap;}
.pstatus{font-size:9px;font-weight:700;text-transform:uppercase;padding:3px 8px;border-radius:2px;background:#0f2a1e;color:#1D9E75;border:1px solid #1D9E75;}
.pedit{font-size:11px;color:#444;background:transparent;border:none;cursor:pointer;padding:2px 4px;}
.pedit:hover{color:#CC0000;}
.pdel{font-size:10px;color:#444;padding:3px 8px;border:1px solid #2a2a2a;border-radius:2px;cursor:pointer;background:transparent;font-family:Consolas,monospace;text-transform:uppercase;}
.pdel:hover{color:#CC0000;border-color:#CC0000;}
.parrow{font-size:14px;color:#333;}
.pitem:hover .parrow{color:#CC0000;}
.empty{padding:40px 0;text-align:center;color:#333;font-size:11px;text-transform:uppercase;letter-spacing:0.1em;}
.overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.8);z-index:100;align-items:center;justify-content:center;}
.overlay.open{display:flex;}
.mbox{background:#1a1a1a;border:1px solid #2a2a2a;border-top:3px solid #CC0000;border-radius:3px;padding:28px;width:440px;max-width:95vw;}
.mtitle{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:20px;}
.minput{width:100%;background:#111;border:1px solid #333;border-radius:2px;color:#fff;font-family:Consolas,monospace;font-size:13px;padding:10px 12px;outline:none;margin-bottom:12px;}
.minput:focus{border-color:#CC0000;}
.minput::placeholder{color:#444;}
.mrow{display:flex;gap:10px;}
.mbtn{padding:8px 20px;border-radius:3px;font-family:Consolas,monospace;font-size:11px;font-weight:700;text-transform:uppercase;cursor:pointer;border:none;}
.mbtn-red{background:#CC0000;color:#fff;}
.mbtn-gray{background:#2a2a2a;color:#888;}
.mbtns{display:flex;gap:10px;justify-content:flex-end;margin-top:4px;}
footer{padding:16px 32px;border-top:1px solid #1a1a1a;display:flex;align-items:center;justify-content:space-between;}
.ft{font-size:9px;color:#333;text-transform:uppercase;letter-spacing:0.1em;}

.user-info{font-size:9px;color:#444;text-transform:uppercase;letter-spacing:0.1em;}</style>
</head>

<script src="auth.js"></script>
<script>
var projects=[], deleteTarget=null, editId=null;

requireAuth(function(){
  loadProjects();
});

function loadProjects(){
  document.getElementById('emptyMsg').textContent='Loading...';
  getProjects().then(function(data){
    projects=data||[];
    render();
  }).catch(function(e){
    document.getElementById('emptyMsg').textContent='Error loading: '+e.message;
  });
}

document.getElementById('newBtn').onclick=function(){
  editId=null;
  document.getElementById('modalTitle').textContent='New Rental Project';
  document.getElementById('projName').value='';
  document.getElementById('projClient').value='';
  document.getElementById('projEvent').value='';
  document.getElementById('projAddress').value='';
  document.getElementById('projStart').value='';
  document.getElementById('projEnd').value='';
  document.getElementById('projTG').value='';
  document.getElementById('tgLink').href='#';
  document.getElementById('createBtn').textContent='Create Project';
  document.getElementById('newModal').classList.add('open');
  setTimeout(function(){document.getElementById('projName').focus();},100);
};

document.getElementById('cancelBtn').onclick=function(){document.getElementById('newModal').classList.remove('open');};

document.getElementById('projTG').oninput=function(){
  document.getElementById('tgLink').href=this.value.trim()||'#';
};

document.getElementById('createBtn').onclick=function(){
  var name=document.getElementById('projName').value.trim();
  if(!name)return;
  var p={
    id:editId||Date.now()+'',
    name:name,
    client:document.getElementById('projClient').value.trim(),
    event:document.getElementById('projEvent').value.trim(),
    address:document.getElementById('projAddress').value.trim(),
    start:document.getElementById('projStart').value.trim(),
    end:document.getElementById('projEnd').value.trim(),
    telegram:document.getElementById('projTG').value.trim(),
    created:Date.now()
  };
  document.getElementById('createBtn').textContent='Saving...';
  document.getElementById('createBtn').disabled=true;
  saveProject(p).then(function(){
    if(editId){
      var idx=projects.findIndex(function(x){return x.id===editId;});
      if(idx!==-1) projects[idx]=p;
    } else {
      projects.unshift(p);
    }
    document.getElementById('newModal').classList.remove('open');
    document.getElementById('createBtn').textContent='Create Project';
    document.getElementById('createBtn').disabled=false;
    editId=null;
    render();
  }).catch(function(e){
    alert('Error: '+e.message);
    document.getElementById('createBtn').textContent='Create Project';
    document.getElementById('createBtn').disabled=false;
  });
};

document.getElementById('projName').onkeydown=function(e){if(e.key==='Enter')document.getElementById('createBtn').click();};

document.getElementById('confirmNo').onclick=function(){resetConfirm();};
document.getElementById('confirmYes').onclick=function(){
  document.getElementById('step1').style.display='none';
  document.getElementById('step2').style.display='block';
  document.getElementById('pinInput').value='';
  document.getElementById('pinError').textContent='';
  setTimeout(function(){document.getElementById('pinInput').focus();},100);
};
document.getElementById('pinCancel').onclick=function(){resetConfirm();};
document.getElementById('pinOk').onclick=function(){
  if(document.getElementById('pinInput').value==='1008'){
    deleteProject(deleteTarget).then(function(){
      projects=projects.filter(function(p){return p.id!==deleteTarget;});
      resetConfirm();render();
    });
  } else {
    document.getElementById('pinError').textContent='Incorrect PIN.';
    document.getElementById('pinInput').value='';
  }
};
document.getElementById('pinInput').onkeydown=function(e){if(e.key==='Enter')document.getElementById('pinOk').click();};

function resetConfirm(){
  document.getElementById('confirmModal').classList.remove('open');
  document.getElementById('step1').style.display='block';
  document.getElementById('step2').style.display='none';
  deleteTarget=null;
}

function formatDate(ts){var d=new Date(ts);return (d.getMonth()+1)+'/'+(d.getDate())+'/'+d.getFullYear();}

function render(){
  var list=document.getElementById('list');
  list.innerHTML='';
  if(!projects.length){
    list.innerHTML='<div class="empty">No projects yet &mdash; create your first one</div>';
    return;
  }
  projects.forEach(function(p){
    var item=document.createElement('div');item.className='pitem';
    item.innerHTML=
      '<div style="display:flex;align-items:center;gap:8px;flex:1">'+
        '<span class="pname">'+p.name+'</span>'+
        '<button class="pedit" data-id="'+p.id+'" title="Edit">&#9998;</button>'+
      '</div>'+
      (p.client?'<div class="pclient">'+p.client+'</div>':'')+
      (p.event?'<div class="pclient" style="color:#888">'+p.event+'</div>':'')+
      (p.start?'<div class="pdate">'+p.start.replace('T',' ')+'</div>':'<div class="pdate">'+formatDate(p.created)+'</div>')+
      '<div class="pstatus">Active</div>'+
      (p.telegram?'<a href="'+p.telegram+'" target="_blank" onclick="event.stopPropagation()" style="font-size:9px;color:#CC0000;text-decoration:none;border:1px solid #CC0000;padding:2px 8px;border-radius:2px;white-space:nowrap;font-weight:700;text-transform:uppercase">TG &#8599;</a>':'')+
      '<button class="pdel" data-id="'+p.id+'">Delete</button>'+
      '<div class="parrow">&#8594;</div>';
    item.querySelector('.pedit').onclick=function(e){
      e.stopPropagation();
      var proj=projects.find(function(x){return x.id===p.id;});
      editId=proj.id;
      document.getElementById('modalTitle').textContent='Edit Project';
      document.getElementById('projName').value=proj.name||'';
      document.getElementById('projClient').value=proj.client||'';
      document.getElementById('projEvent').value=proj.event||'';
      document.getElementById('projAddress').value=proj.address||'';
      document.getElementById('projStart').value=proj.start||'';
      document.getElementById('projEnd').value=proj.end||'';
      document.getElementById('projTG').value=proj.telegram||'';
      document.getElementById('tgLink').href=proj.telegram||'#';
      document.getElementById('createBtn').textContent='Save Changes';
      document.getElementById('newModal').classList.add('open');
    };
    item.querySelector('.pdel').onclick=function(e){
      e.stopPropagation();
      deleteTarget=p.id;
      document.getElementById('confirmModal').classList.add('open');
    };
    item.onclick=function(){
      window.location.href='equipment.html?project='+encodeURIComponent(p.id)+'&name='+encodeURIComponent(p.name);
    };
    list.appendChild(item);
  });
}
</script>
</body>
</html>
